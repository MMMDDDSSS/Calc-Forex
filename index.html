<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Усреднение</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap');

:root{
  --bg:#0A0D12;
  --panel:#11151C;
  --panel-2:#161B24;
  --border:#232A38;
  --text:#E7EAF0;
  --muted:#7C8494;
  --long:#22C3A6;
  --short:#F2545B;
  --entry:#38BDF8;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Space Grotesk',sans-serif;
  font-size:13px;
  overflow:hidden;
  transition:background .4s ease;
}
.wrap{height:100vh;max-width:1600px;margin:0 auto;padding:24px 48px;display:flex;flex-direction:column;gap:10px;overflow:hidden;}

/* header */
.hdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto;}
.hdr-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.hdr h1{font-size:18px;font-weight:700;letter-spacing:.02em;margin:0;color:var(--text);}
.hdr h1 span{color:var(--entry);}
.instr-tabs{display:flex;gap:5px;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:3px;}
.instr-tab{
  padding:6px 11px;border-radius:6px;border:none;background:transparent;color:var(--muted);
  font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;
  display:flex;align-items:center;gap:5px;
}
.instr-tab.active{color:#fff;}
.instr-tab:hover:not(.active){color:var(--text);}
.hdr-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.toggle-label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer;user-select:none;}
.toggle-label input{cursor:pointer;}
.reset-btn{
  background:none;border:1px solid var(--border);color:var(--muted);border-radius:7px;
  padding:6px 10px;font-family:'Space Grotesk',sans-serif;font-size:11px;cursor:pointer;
}
.reset-btn:hover{border-color:var(--short);color:var(--short);}

/* main grid */
.main{flex:1;min-height:0;display:grid;grid-template-columns:400px 1fr;grid-template-rows:1fr;gap:12px;}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;height:100%;}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.panel-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px;}

/* config grid */
.cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;}
.field input{
  width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  border-radius:7px;padding:7px 9px;font-family:'Space Grotesk',sans-serif;font-size:13px;
}
.field input:focus{outline:none;border-color:var(--entry);}
.dir-toggle{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
.dir-btn{flex:1;padding:7px 0;background:var(--panel-2);color:var(--muted);border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12px;}
.dir-btn.active.long{background:rgba(34,195,166,.18);color:var(--long);}
.dir-btn.active.short{background:rgba(242,84,91,.18);color:var(--short);}
.dynamic-note{margin-top:8px;font-size:10px;color:#F5A623;line-height:1.4;}
.step-toggle{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
.step-btn{flex:1;padding:6px 0;background:var(--panel-2);color:var(--muted);border:none;border-left:1px solid var(--border);cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:11px;}
.step-btn:first-child{border-left:none;}
.step-btn.active{background:rgba(56,189,248,.18);color:var(--entry);}

/* entries */
.entries-panel{flex:1;min-height:0;display:flex;flex-direction:column;}
.entries-head, .entry-row{display:grid;grid-template-columns:1fr 1fr 26px;gap:8px;align-items:center;}
.entries-head{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
.entries-scroll{overflow-y:auto;max-height:120px;padding-right:2px;}
.entry-row{margin-bottom:6px;}
.entry-row input{
  background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  border-radius:7px;padding:7px 9px;font-family:'Space Grotesk',sans-serif;font-size:13px;width:100%;
}
.entry-row input:focus{outline:none;border-color:var(--entry);}
.rm-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:7px;width:26px;height:28px;cursor:pointer;font-size:13px;}
.rm-btn:hover{border-color:var(--short);color:var(--short);}
.add-btn{
  margin-top:4px;background:none;border:1px dashed var(--border);color:var(--entry);
  border-radius:7px;padding:7px 12px;cursor:pointer;font-family:'Space Grotesk',sans-serif;
  font-size:12px;font-weight:600;width:100%;
}
.add-btn:hover{border-color:var(--entry);background:rgba(56,189,248,.07);}

/* reverse calc */
.reverse-row{display:flex;gap:8px;align-items:end;}
.reverse-row .field{flex:0 0 120px;}
.reverse-result{flex:1;font-size:11px;color:var(--muted);}
.reverse-result b{display:block;font-size:14px;color:var(--text);}
.reverse-result.err b{color:var(--short);font-size:11px;}
.apply-btn{
  background:var(--entry);border:none;color:#04222E;border-radius:7px;padding:8px 12px;
  font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;
}
.apply-btn:disabled{opacity:.35;cursor:not-allowed;}

.rr-toggles{display:flex;flex-wrap:wrap;gap:6px;}
.rr-toggle{display:flex;align-items:center;gap:5px;background:var(--panel-2);border:1px solid var(--border);border-radius:7px;padding:5px 8px;cursor:pointer;user-select:none;font-size:11px;font-weight:600;color:var(--muted);}
.rr-toggle input{cursor:pointer;accent-color:var(--dot,var(--entry));}
.rr-toggle .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.rr-toggle.off{opacity:.4;}

/* right column / ladder */
.ladder-panel{flex:1;min-height:0;display:flex;flex-direction:column;}
.ladder-box{position:relative;flex:1;min-height:0;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--panel-2);}
.tv-zone-bg{position:absolute;left:20%;right:20%;}
.tv-line{position:absolute;left:20%;right:20%;border-top:1px solid rgba(255,255,255,.14);}
.tv-line.entry-line{border-top-style:dashed;}
.tv-pill{position:absolute;top:0;background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap;}
.tv-pill.price{left:20%;transform:translate(-50%,-50%);}
.tv-pill.center{left:50%;transform:translate(-50%,-50%);}
.tv-pill.value{right:20%;transform:translate(50%,-50%);}

/* results */
.results-panel{flex:0 0 auto;}
.result-top{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;}
.stat{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
.stat-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.stat-val{font-size:14px;font-weight:600;color:var(--text);}
.stat-val.risk{color:var(--short);}
.stat-val.comm{color:#F5A623;}
.rr-table{width:100%;border-collapse:collapse;}
.rr-table th{text-align:left;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 6px 6px;font-weight:600;}
.rr-table td{padding:6px 6px;border-top:1px solid var(--border);font-size:12px;}
.rr-table tr td:first-child{font-weight:600;}
.rr-table .net{color:var(--long);font-weight:600;}
.rr-table .muted-cell{color:var(--muted);}
.empty-state{color:var(--muted);font-size:12px;text-align:center;padding:14px 0;}

/* history */
.hist-url-row, .hist-save-row{display:flex;gap:8px;margin-bottom:8px;}
.hist-url-row input, .hist-save-row input{
  flex:1;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  border-radius:7px;padding:7px 9px;font-family:'Space Grotesk',sans-serif;font-size:12px;
}
.hist-url-row input:focus, .hist-save-row input:focus{outline:none;border-color:var(--entry);}
.history-list{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto;}
.hist-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--panel-2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:11px;
}
.hist-item-main{display:flex;flex-direction:column;gap:2px;overflow:hidden;}
.hist-item-main b{font-size:12px;color:var(--text);}
.hist-item-main span{color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hist-item-btns{display:flex;gap:6px;flex-shrink:0;}
.hist-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 8px;font-size:10px;cursor:pointer;font-family:'Space Grotesk',sans-serif;}
.hist-btn.load:hover{border-color:var(--entry);color:var(--entry);}
.hist-btn.del:hover{border-color:var(--short);color:var(--short);}

@media (max-width:900px){
  body{overflow:auto;}
  .wrap{height:auto;overflow:visible;}
  .main{grid-template-columns:1fr;}
  .result-top{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <div class="hdr-left">
      <h1>Усредн<span>ение</span></h1>
      <div class="instr-tabs" id="instrTabs"></div>
    </div>
    <div class="hdr-right">
      <label class="toggle-label"><input type="checkbox" id="dirBgToggle"> фон по направлению</label>
      <button class="reset-btn" id="resetBtn">Сбросить актив</button>
    </div>
  </div>

  <div class="main">
    <div class="col">
      <div class="panel">
        <p class="panel-title">Параметры сделки</p>
        <div class="cfg-grid">
          <div class="field"><label>Депозит ($)</label><input type="number" id="deposit" step="100"></div>
          <div class="field"><label>Направление</label>
            <div class="dir-toggle"><button class="dir-btn long" id="dirLong">Лонг</button><button class="dir-btn short" id="dirShort">Шорт</button></div>
          </div>
          <div class="field"><label>Стоп (SL)</label><input type="number" id="slPrice" step="any"></div>
          <div class="field"><label id="pointValueLabel">$/пункт/лот</label><input type="number" id="pointValue" step="any"></div>
          <div class="field" style="grid-column:1/-1;"><label>Комиссия ($/лот)</label><input type="number" id="commission" step="any"></div>
          <div class="field" style="grid-column:1/-1;">
            <label>Шаг цены (стрелками ↑↓ в полях цены)</label>
            <div class="step-toggle" id="stepToggle"></div>
          </div>
        </div>
        <div id="dynamicNote" class="dynamic-note" style="display:none;">⚠ GER40: комиссия плавает от курса EURUSD — сверь значение в терминале.</div>
      </div>

      <div class="panel entries-panel">
        <p class="panel-title">Входы</p>
        <div class="entries-head"><span>Цена</span><span>Лоты</span><span></span></div>
        <div class="entries-scroll"><div id="entriesList"></div></div>
        <button class="add-btn" id="addEntry">+ добавить вход</button>
      </div>

      <div class="panel">
        <p class="panel-title">Уровни RR</p>
        <div class="rr-toggles" id="rrToggles"></div>
      </div>

      <div class="panel">
        <p class="panel-title">Риск → стоп</p>
        <div class="reverse-row">
          <div class="field"><label>Риск ($)</label><input type="number" id="targetRisk" step="any" placeholder="5000"></div>
          <div class="reverse-result" id="reverseResult">—</div>
          <button class="apply-btn" id="applyReverse" disabled>Применить</button>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="panel ladder-panel" id="ladderPanel" style="display:none;">
        <p class="panel-title">Лестница цен</p>
        <div class="ladder-box" id="ladderBox"></div>
      </div>
      <div class="panel results-panel" id="resultsPanel">
        <p class="panel-title">Результат</p>
        <div id="resultsBody"></div>
      </div>

      <div class="panel">
        <p class="panel-title">История расчётов</p>
        <div class="hist-url-row">
          <input type="text" id="scriptUrl" placeholder="URL Apps Script (…/exec)">
          <button class="reset-btn" id="saveUrlBtn">Сохранить URL</button>
        </div>
        <div class="hist-save-row">
          <input type="text" id="saveNote" placeholder="Заметка (необязательно)">
          <button class="apply-btn" id="saveCalcBtn">Сохранить расчёт</button>
        </div>
        <div id="historyList" class="history-list"></div>
      </div>
    </div>
  </div>

</div>

<script>
const instruments = {
  EURUSD:{ label:'EURUSD', pointValue:100000, commission:7,    decimals:5, dynamicComm:false, color:'#4C8BF5', icon:'🇪🇺' },
  GBPUSD:{ label:'GBPUSD', pointValue:100000, commission:7,    decimals:5, dynamicComm:false, color:'#A855F7', icon:'🇬🇧' },
  GER40: { label:'GER40',  pointValue:1.17,   commission:0.61, decimals:2, dynamicComm:true,  color:'#F472B6', icon:'📊' },
  US100: { label:'US100',  pointValue:1,      commission:0.60, decimals:2, dynamicComm:false, color:'#E8A33D', icon:'📈' },
};

const RR_DEFS = [
  {mult:1,   label:'RR 1:1',   color:'#F59E0B'},
  {mult:1.3, label:'RR 1:1.3', color:'#A855F7'},
  {mult:2,   label:'RR 1:2',   color:'#06B6D4'},
  {mult:3,   label:'RR 1:3',   color:'#10B981'},
  {mult:4,   label:'RR 1:4',   color:'#3B82F6'},
  {mult:5,   label:'RR 1:5',   color:'#EC4899'},
];
const enabledRR = {}; // global — all RR levels on by default, shared across instruments
RR_DEFS.forEach(d => enabledRR[d.mult] = true);
function hexToRgba(hex, a){
  const v = hex.replace('#','');
  const r = parseInt(v.substring(0,2),16), g = parseInt(v.substring(2,4),16), b = parseInt(v.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

const el = id => document.getElementById(id);

function getDefaultState(key){
  const cfg = instruments[key];
  return {
    deposit: 100000, direction: 'long', slPrice: '',
    pointValue: cfg.pointValue, commission: cfg.commission,
    entries: [ {price:'', volume:''}, {price:'', volume:''} ],
    targetRisk: '',
    priceStep: Math.pow(10, -cfg.decimals)
  };
}

let currentInstr = 'EURUSD';
const state = {};
Object.keys(instruments).forEach(k => state[k] = getDefaultState(k));

// number formatting: space thousands separator, dot decimal, no locale surprises
function formatNumber(n, decimals){
  if(n===null || n===undefined || isNaN(n)) return '—';
  const neg = n<0;
  n = Math.abs(n);
  const fixed = n.toFixed(decimals);
  let [intPart, decPart] = fixed.split('.');
  intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg?'-':'') + intPart + (decPart!==undefined ? '.'+decPart : '');
}
function fmt(n, d){ return formatNumber(n, d); }
function fmtMoney(n){
  if(n===null || n===undefined || isNaN(n)) return '—';
  const neg = n<0;
  return (neg?'-':'') + '$' + formatNumber(Math.abs(n), 2);
}

function buildTabs(){
  const wrap = el('instrTabs');
  wrap.innerHTML='';
  Object.keys(instruments).forEach(key=>{
    const cfg = instruments[key];
    const b = document.createElement('button');
    b.className = 'instr-tab' + (key===currentInstr ? ' active' : '');
    if(key===currentInstr) b.style.background = cfg.color;
    b.innerHTML = `<span>${cfg.icon}</span><span>${cfg.label}</span>`;
    b.onclick = ()=>{ currentInstr = key; buildTabs(); renderForm(); renderCalc(); updateDirectionBg(); };
    wrap.appendChild(b);
  });
}

function buildRRToggles(){
  const wrap = el('rrToggles');
  wrap.innerHTML='';
  RR_DEFS.forEach(d=>{
    const label = document.createElement('label');
    label.className = 'rr-toggle' + (enabledRR[d.mult] ? '' : ' off');
    label.style.setProperty('--dot', d.color);
    label.innerHTML = `<span class="dot" style="background:${d.color}"></span><input type="checkbox" ${enabledRR[d.mult] ? 'checked' : ''}><span>${d.label}</span>`;
    label.querySelector('input').addEventListener('change', e=>{
      enabledRR[d.mult] = e.target.checked;
      label.classList.toggle('off', !e.target.checked);
      renderCalc();
    });
    wrap.appendChild(label);
  });
}

function stepOptions(decimals){
  const base = Math.pow(10, -decimals);
  return [1,10,100,1000].map(mult => +(base*mult).toFixed(decimals));
}

function buildStepToggle(){
  const cfg = instruments[currentInstr];
  const s = state[currentInstr];
  const wrap = el('stepToggle');
  wrap.innerHTML='';
  stepOptions(cfg.decimals).forEach(val=>{
    const b = document.createElement('button');
    b.className = 'step-btn' + (Math.abs(val-s.priceStep)<1e-12 ? ' active' : '');
    b.textContent = val.toFixed(cfg.decimals);
    b.onclick = ()=>{ state[currentInstr].priceStep = val; renderForm(); };
    wrap.appendChild(b);
  });
}

function renderForm(){
  const s = state[currentInstr];
  const cfg = instruments[currentInstr];
  el('deposit').value = s.deposit;
  el('slPrice').value = s.slPrice;
  el('slPrice').step = s.priceStep;
  el('pointValue').value = s.pointValue;
  el('commission').value = s.commission;
  el('targetRisk').value = s.targetRisk;
  el('pointValueLabel').textContent = (currentInstr==='EURUSD'||currentInstr==='GBPUSD') ? '$/1.0 цены/лот' : '$/пункт/лот';
  el('dynamicNote').style.display = cfg.dynamicComm ? 'block' : 'none';
  el('dirLong').classList.toggle('active', s.direction==='long');
  el('dirShort').classList.toggle('active', s.direction==='short');
  buildStepToggle();
  buildEntryRows();
}

function buildEntryRows(){
  const s = state[currentInstr];
  const list = el('entriesList');
  list.innerHTML='';
  s.entries.forEach((entry, i)=>{
    const row = document.createElement('div');
    row.className='entry-row';
    row.innerHTML = `
      <input type="number" step="${s.priceStep}" placeholder="цена" value="${entry.price}" data-i="${i}" data-f="price">
      <input type="number" step="any" placeholder="лоты" value="${entry.volume}" data-i="${i}" data-f="volume">
      <button class="rm-btn" data-i="${i}">×</button>`;
    list.appendChild(row);
  });
  list.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const i = +e.target.dataset.i, f = e.target.dataset.f;
      state[currentInstr].entries[i][f] = e.target.value;
      renderCalc();
    });
  });
  list.querySelectorAll('.rm-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const i = +e.target.dataset.i;
      const s = state[currentInstr];
      if(s.entries.length>1){ s.entries.splice(i,1); buildEntryRows(); renderCalc(); }
    });
  });
}

function getValidEntries(s){
  return s.entries
    .map(e=>({price:parseFloat(e.price), volume:parseFloat(e.volume)}))
    .filter(e=>!isNaN(e.price) && !isNaN(e.volume) && e.volume>0);
}

function calculate(){
  const s = state[currentInstr];
  const cfg = instruments[currentInstr];
  const deposit = parseFloat(s.deposit)||0;
  const slPrice = parseFloat(s.slPrice);
  const pointValue = parseFloat(s.pointValue)||0;
  const commissionPerLot = parseFloat(s.commission)||0;

  const valid = getValidEntries(s);
  if(valid.length===0 || isNaN(slPrice) || deposit<=0) return null;

  const totalVolume = valid.reduce((sum,e)=>sum+e.volume,0);
  const avgEntry = valid.reduce((sum,e)=>sum+e.price*e.volume,0)/totalVolume;
  const distToSL = Math.abs(avgEntry - slPrice);
  const totalCommission = totalVolume * commissionPerLot;
  const riskGross = distToSL * totalVolume * pointValue;
  const riskNet = riskGross + totalCommission;
  const riskPercent = riskNet/deposit*100;
  const commissionDistance = (totalVolume*pointValue) > 0 ? totalCommission/(totalVolume*pointValue) : 0;

  const rrLevels = RR_DEFS.map(lvl=>{
    const priceTarget = s.direction==='long' ? avgEntry + distToSL*lvl.mult : avgEntry - distToSL*lvl.mult;
    const priceAdjusted = s.direction==='long' ? priceTarget + commissionDistance : priceTarget - commissionDistance;
    const grossProfit = distToSL*lvl.mult*totalVolume*pointValue;
    const netProfit = grossProfit - totalCommission;
    const netPercent = netProfit/deposit*100;
    return {...lvl, priceTarget, priceAdjusted, netProfit, netPercent, dist:distToSL*lvl.mult};
  });

  return { deposit, slPrice, avgEntry, totalVolume, distToSL, totalCommission, riskGross, riskNet, riskPercent, rrLevels, decimals:cfg.decimals, direction:s.direction };
}

function calculateReverse(){
  const s = state[currentInstr];
  const pointValue = parseFloat(s.pointValue)||0;
  const commissionPerLot = parseFloat(s.commission)||0;
  const targetRisk = parseFloat(s.targetRisk);
  const valid = getValidEntries(s);
  if(valid.length===0 || isNaN(targetRisk) || pointValue<=0) return null;

  const totalVolume = valid.reduce((sum,e)=>sum+e.volume,0);
  const avgEntry = valid.reduce((sum,e)=>sum+e.price*e.volume,0)/totalVolume;
  const totalCommission = totalVolume*commissionPerLot;
  const netForDistance = targetRisk - totalCommission;
  if(netForDistance<=0) return { avgEntry, totalCommission, error:true };

  const distance = netForDistance/(totalVolume*pointValue);
  const slComputed = s.direction==='long' ? avgEntry-distance : avgEntry+distance;
  return { avgEntry, totalCommission, distance, slComputed };
}

function renderReverse(){
  const cfg = instruments[currentInstr];
  const r = calculateReverse();
  const box = el('reverseResult');
  const btn = el('applyReverse');
  if(!r){ box.innerHTML = '—'; box.classList.remove('err'); btn.disabled = true; return; }
  if(r.error){
    box.innerHTML = `комиссия ${fmtMoney(r.totalCommission)} больше риска`;
    box.classList.add('err'); btn.disabled = true; return;
  }
  box.classList.remove('err');
  box.innerHTML = `стоп<b>${fmt(r.slComputed, cfg.decimals)}</b>`;
  btn.disabled = false;
  btn.onclick = ()=>{
    state[currentInstr].slPrice = r.slComputed.toFixed(cfg.decimals);
    el('slPrice').value = state[currentInstr].slPrice;
    renderCalc();
  };
}

function renderLadder(res){
  const panel = el('ladderPanel');
  const box = el('ladderBox');
  if(!res){ panel.style.display='none'; return; }
  panel.style.display='flex';
  box.innerHTML='';

  const visibleRR = res.rrLevels.filter(l => enabledRR[l.mult]);

  const points = [
    {key:'sl',    label:'Стоп', price:res.slPrice,  valText: fmtMoney(-res.riskNet),                 hex:'#F2545B', a:0.9,  dashed:false},
    {key:'entry', label:'ВХОД', price:res.avgEntry, valText: fmt(res.totalVolume,2)+' лот',           hex:'#38BDF8', a:0.9,  dashed:true},
    ...visibleRR.map(l=>({key:l.label, label:l.label, price:l.priceTarget, valText: fmtMoney(l.netProfit), hex:l.color, a:0.9, dashed:false}))
  ];
  const prices = points.map(p=>p.price);
  const min = Math.min(...prices), max = Math.max(...prices);
  const span = (max-min) || 1;
  const PAD = 8; // % buffer top/bottom — levels spread across the full ladder height
  const pctOf = price => {
    const raw = (price-min)/span; // 0 (min price) .. 1 (max price)
    return PAD + (1-raw)*(100-2*PAD);
  };

  const entryPct = pctOf(res.avgEntry);
  const riskPct = pctOf(res.slPrice); // Стоп line
  const redTop = Math.min(riskPct, entryPct);
  const redHeight = Math.abs(riskPct - entryPct);

  const zoneRisk = document.createElement('div');
  zoneRisk.className='tv-zone-bg';
  zoneRisk.style.cssText = `top:${redTop}%;height:${redHeight}%;background:rgba(242,84,91,.14);`;
  box.appendChild(zoneRisk);

  if(visibleRR.length){
    const farthest = visibleRR.reduce((a,b)=> b.mult>a.mult ? b : a); // max enabled RR
    const profitPct = pctOf(farthest.priceTarget);
    const greenTop = Math.min(profitPct, entryPct);
    const greenHeight = Math.abs(profitPct - entryPct);
    const zoneProfit = document.createElement('div');
    zoneProfit.className='tv-zone-bg';
    zoneProfit.style.cssText = `top:${greenTop}%;height:${greenHeight}%;background:rgba(34,195,166,.14);`;
    box.appendChild(zoneProfit);
  }

  points.forEach(p=>{
    const topPct = pctOf(p.price);
    const lineColor = hexToRgba(p.hex, Math.min(p.a+0.1, 1));
    const line = document.createElement('div');
    line.className = 'tv-line' + (p.dashed ? ' entry-line' : '');
    line.style.top = topPct+'%';
    line.style.borderTopColor = lineColor;
    box.appendChild(line);

    const borderColor = hexToRgba(p.hex, Math.min(p.a+0.15, 1));
    const textColor = hexToRgba(p.hex, Math.min(p.a+0.3, 1));
    const pillStyle = `top:${topPct}%;border-color:${borderColor};color:${textColor};`;

    const pPrice = document.createElement('div');
    pPrice.className='tv-pill price';
    pPrice.style.cssText = pillStyle;
    pPrice.textContent = fmt(p.price,res.decimals);
    box.appendChild(pPrice);

    const pCenter = document.createElement('div');
    pCenter.className='tv-pill center';
    pCenter.style.cssText = pillStyle;
    pCenter.textContent = p.label;
    box.appendChild(pCenter);

    const pValue = document.createElement('div');
    pValue.className='tv-pill value';
    pValue.style.cssText = pillStyle;
    pValue.textContent = p.valText;
    box.appendChild(pValue);
  });
}

function renderResults(res){
  const body = el('resultsBody');
  if(!res){
    body.innerHTML = `<div class="empty-state">Заполни входы, стоп-цену и депозит</div>`;
    return;
  }
  body.innerHTML = `
    <div class="result-top">
      <div class="stat"><div class="stat-lbl">Ср. вход</div><div class="stat-val">${fmt(res.avgEntry,res.decimals)}</div></div>
      <div class="stat"><div class="stat-lbl">Объём</div><div class="stat-val">${fmt(res.totalVolume,2)}</div></div>
      <div class="stat"><div class="stat-lbl">Комиссия</div><div class="stat-val comm">${fmtMoney(res.totalCommission)}</div></div>
      <div class="stat"><div class="stat-lbl">Риск (${fmt(res.riskPercent,2)}%)</div><div class="stat-val risk">${fmtMoney(res.riskNet)}</div></div>
    </div>
    <table class="rr-table">
      <thead><tr><th>Уровень</th><th>Цена</th><th>Цена с комиссией</th><th>Итого</th><th>% депо</th></tr></thead>
      <tbody>
        ${res.rrLevels.filter(l => enabledRR[l.mult]).map(l=>{
          const hex = l.color;
          const bg = hexToRgba(hex, 0.14);
          const border = hexToRgba(hex, 0.9);
          const label = hexToRgba(hex, 1);
          return `
          <tr style="background:${bg};">
            <td style="border-left:3px solid ${border};padding-left:9px;color:${label};">${l.label}</td>
            <td class="muted-cell">${fmt(l.priceTarget,res.decimals)}</td>
            <td>${fmt(l.priceAdjusted,res.decimals)}</td>
            <td class="net" style="color:${label};">${fmtMoney(l.netProfit)}</td>
            <td class="net" style="color:${label};">${fmt(l.netPercent,2)}%</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
}

function updateDirectionBg(){
  if(!el('dirBgToggle').checked){ document.body.style.background = 'var(--bg)'; return; }
  const dir = state[currentInstr].direction;
  document.body.style.background = dir==='long' ? '#0C2620' : '#2A1013';
}

// ---- history sync (Google Apps Script backend) ----
const SCRIPT_URL_KEY = 'avg_calc_script_url';
let scriptUrl = '';
try{ scriptUrl = localStorage.getItem(SCRIPT_URL_KEY) || ''; }catch(e){}

function fmtDate(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  }catch(e){ return iso; }
}

function renderHistory(list){
  const box = el('historyList');
  if(!list || list.error){ box.innerHTML = `<div class="empty-state">Не удалось загрузить историю</div>`; return; }
  if(list.length===0){ box.innerHTML = `<div class="empty-state">Пока пусто</div>`; return; }
  box.innerHTML = list.map(item=>{
    const cfg = instruments[item.instrument] || {};
    return `
      <div class="hist-item">
        <div class="hist-item-main">
          <b>${cfg.icon||''} ${item.instrument}${item.note ? ' · '+item.note : ''}</b>
          <span>${fmtDate(item.timestamp)}</span>
        </div>
        <div class="hist-item-btns">
          <button class="hist-btn load" data-id="${item.id}">Загрузить</button>
          <button class="hist-btn del" data-id="${item.id}">Удалить</button>
        </div>
      </div>`;
  }).join('');
  box.querySelectorAll('.hist-btn.load').forEach(b=> b.addEventListener('click', ()=> loadCalculation(b.dataset.id)));
  box.querySelectorAll('.hist-btn.del').forEach(b=> b.addEventListener('click', ()=> deleteCalculation(b.dataset.id)));
}

function loadHistory(){
  if(!scriptUrl) { el('historyList').innerHTML = `<div class="empty-state">Укажи URL Apps Script выше</div>`; return; }
  fetch(scriptUrl + '?action=list')
    .then(r=>r.json())
    .then(renderHistory)
    .catch(()=>{ el('historyList').innerHTML = `<div class="empty-state">Ошибка соединения со скриптом</div>`; });
}

function saveCalculation(){
  if(!scriptUrl){ alert('Сначала укажи и сохрани URL Apps Script'); return; }
  const note = el('saveNote').value;
  const btn = el('saveCalcBtn');
  btn.disabled = true; btn.textContent = 'Сохраняю…';
  fetch(scriptUrl, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'save', instrument: currentInstr, note: note, state: state[currentInstr] })
  })
    .then(r=>r.json())
    .then(()=>{ el('saveNote').value=''; loadHistory(); })
    .catch(()=>{ alert('Не удалось сохранить — проверь URL скрипта'); })
    .finally(()=>{ btn.disabled=false; btn.textContent='Сохранить расчёт'; });
}

function loadCalculation(id){
  if(!scriptUrl) return;
  fetch(scriptUrl + '?action=load&id=' + encodeURIComponent(id))
    .then(r=>r.json())
    .then(data=>{
      if(data.error || !instruments[data.instrument]) return;
      currentInstr = data.instrument;
      state[currentInstr] = data.state;
      buildTabs(); renderForm(); renderCalc(); updateDirectionBg();
    })
    .catch(()=>{ alert('Не удалось загрузить расчёт'); });
}

function deleteCalculation(id){
  if(!scriptUrl) return;
  fetch(scriptUrl, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'delete', id: id })
  })
    .then(()=>loadHistory())
    .catch(()=>{ alert('Не удалось удалить'); });
}

el('scriptUrl').value = scriptUrl;
el('saveUrlBtn').addEventListener('click', ()=>{
  scriptUrl = el('scriptUrl').value.trim();
  try{ localStorage.setItem(SCRIPT_URL_KEY, scriptUrl); }catch(e){}
  loadHistory();
});
el('saveCalcBtn').addEventListener('click', saveCalculation);
if(scriptUrl) loadHistory(); else el('historyList').innerHTML = `<div class="empty-state">Укажи URL Apps Script выше</div>`;

function renderCalc(){
  const res = calculate();
  renderResults(res);
  renderLadder(res);
  renderReverse();
}

el('addEntry').addEventListener('click', ()=>{
  state[currentInstr].entries.push({price:'', volume:''});
  buildEntryRows();
  renderCalc();
});
el('dirLong').addEventListener('click', ()=>{ state[currentInstr].direction='long'; renderForm(); renderCalc(); updateDirectionBg(); });
el('dirShort').addEventListener('click', ()=>{ state[currentInstr].direction='short'; renderForm(); renderCalc(); updateDirectionBg(); });
['deposit','slPrice','pointValue','commission','targetRisk'].forEach(id=>{
  el(id).addEventListener('input', e=>{ state[currentInstr][id] = e.target.value; renderCalc(); });
});
el('resetBtn').addEventListener('click', ()=>{
  state[currentInstr] = getDefaultState(currentInstr);
  renderForm(); renderCalc();
});
el('dirBgToggle').addEventListener('change', updateDirectionBg);

buildTabs();
buildRRToggles();
renderForm();
renderCalc();
updateDirectionBg();
</script>
</body>
</html>
